name: Farm foundation verification
on:
  pull_request:
    paths:
      - 'src/lib/farm/**'
      - 'src/lib/push/farmAttention.ts'
      - 'src/components/BottomNav.tsx'
      - 'src/app/api/farm/**'
      - 'src/app/api/cron/push-*/**'
      - 'src/app/settings/**'
      - 'src/components/settings/**'
      - 'src/lib/dungeon.ts'
      - 'src/components/farm/**'
      - 'src/app/collection/**'
      - 'src/app/layout.tsx'
      - 'src/lib/supabase/middleware.ts'
      - 'supabase/migrations/*farm*'
      - 'tests/farm/**'
      - '.github/workflows/farm-foundation.yml'
  workflow_dispatch:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: qmon_farm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts pg@8.16.3
      - run: node --test tests/farm/*.test.ts
      - run: node tests/farm/projects-database.test.mjs
        env:
          FARM_TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/qmon_farm_test
      - run: node --test tests/farm/projects-server.test.cjs
      - run: node tests/farm/garden-database.test.mjs
        env:
          FARM_TEST_FOUNDATION: '1'
      - run: ./node_modules/.bin/tsc --noEmit --incremental false
      - run: ./node_modules/.bin/eslint src/lib/farm/catalogue.ts src/lib/farm/projects.ts src/lib/farm/projects-server.ts tests/farm/catalogue.test.ts tests/farm/projects-database.test.mjs
  puzzles:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: qmon_farm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts pg@8.16.3
      - run: node tests/farm/puzzle-database.test.mjs
        env:
          FARM_TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/qmon_farm_test
      - run: node --test tests/farm/puzzle-server.test.cjs tests/farm/layout-server.test.cjs tests/farm/history-server.test.cjs tests/farm/practice-server.test.cjs tests/farm/social-server.test.cjs tests/farm/attention-server.test.cjs
      - run: ./node_modules/.bin/eslint src/lib/farm/attention.ts src/lib/farm/attention-server.ts src/lib/push/farmAttention.ts src/components/farm/useFarmAttention.ts src/components/farm/FarmStartGuide.tsx src/components/farm/AttentionPreview.tsx src/components/BottomNav.tsx src/components/settings/FarmNotificationSettings.tsx src/app/api/farm/attention src/app/settings/farm-notifications.ts tests/farm/attention-server.test.cjs
      - run: ./node_modules/.bin/eslint src/lib/farm/social.ts src/lib/farm/social-server.ts src/components/farm/VisitFarmClient.tsx src/components/farm/FarmEncouragementClient.tsx src/components/farm/SocialPreview.tsx src/app/collection/visit src/app/collection/encouragement tests/farm/social-server.test.cjs src/lib/farm/activities.ts src/lib/farm/history-server.ts src/components/farm/FarmResidents.tsx src/components/farm/PlaceHistoryView.tsx src/components/farm/ActivitiesPreview.tsx src/app/collection/places src/app/collection/practice tests/farm/history-server.test.cjs tests/farm/practice-server.test.cjs src/lib/farm/puzzle-engine.ts src/lib/farm/puzzle-server.ts src/lib/farm/lesson-server.ts src/lib/farm/puzzles/flower.ts src/lib/farm/puzzles/content.ts src/components/farm/SubjectPuzzle.tsx src/components/farm/SubjectLessonClient.tsx src/components/farm/SubjectPreview.tsx src/components/farm/ProjectPuzzleClient.tsx src/components/farm/ProjectQueueClient.tsx src/components/farm/ConstructionPreview.tsx src/components/farm/ProjectQueuePreview.tsx src/lib/farm/construction-puzzles.ts src/lib/farm/project-overview.ts src/lib/farm/project-overview-server.ts src/lib/farm/busy-pets.ts src/lib/dungeon.ts src/app/collection/projects src/app/collection/layout src/lib/farm/layout.ts src/lib/farm/layout-server.ts src/components/farm/LayoutClient.tsx src/components/farm/LayoutPreview.tsx src/components/farm/FarmWorld.tsx src/components/farm/useDraftAutosave.ts src/components/farm/SchoolClient.tsx src/components/farm/GardenClient.tsx src/components/farm/FloorPuzzle.tsx src/components/farm/GardenPathPuzzle.tsx src/app/collection/preview/page.tsx src/app/collection/school/learn/subject src/app/collection/school/learn/page.tsx tests/farm/puzzle-server.test.cjs tests/farm/puzzle-database.test.mjs
